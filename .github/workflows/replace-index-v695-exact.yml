name: Replace index with exact V6.95

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-index-v695-exact.yml'

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct exact uploaded index
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null
          printf '%s' '' | base64 -d > /tmp/index-v695.zstpatch
          zstd -d --patch-from=index.html /tmp/index-v695.zstpatch -o /tmp/index-v695.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('/tmp/index-v695.html').read_bytes()
          blob_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert len(data) == 474823, len(data)
          assert blob_sha == '5113259076312f2581ecc4c8a0921af628e656fa', blob_sha
          print('Verified exact V6.95 blob:', blob_sha)
          PY
          mv /tmp/index-v695.html index.html

      - name: Commit exact index and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/export-index-temp.yml .github/workflows/replace-index-v695-exact.yml
          git add index.html
          git commit -m 'Replace index with exact uploaded V6.95 version'
          git push
