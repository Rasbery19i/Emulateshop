name: Apply V6.91 Discord Header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v691-discord.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V6.91 header update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_button = '<button class="client-btn" data-i18n="client_space" id="clientBtn">Espace client</button>'
          new_button = '<button class="client-btn" id="clientBtn" type="button">Discord</button>'
          old_click = 'document.getElementById("clientBtn").addEventListener("click", ()=>openDrawer("client"));'
          new_click = 'document.getElementById("clientBtn").addEventListener("click", ()=>window.open("https://discord.gg/thnzjVYt2","_blank","noopener"));'
          if old_button not in s:
              raise SystemExit('Old header button not found')
          if old_click not in s:
              raise SystemExit('Old client click handler not found')
          s = s.replace(old_button, new_button, 1).replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n 'id="clientBtn"' index.html
          grep -n 'discord.gg/thnzjVYt2' index.html | tail -n 3
      - name: Commit updated site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy V6.91 Discord header'
          git push
