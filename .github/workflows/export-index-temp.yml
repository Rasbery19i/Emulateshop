name: Export current index temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-index-temp.yml'

permissions:
  contents: read

jobs:
  export-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload current index
        uses: actions/upload-artifact@v4
        with:
          name: current-index-html
          path: index.html
          if-no-files-found: error
