name: Deploy Emulate Shop V6.95

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-v695:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply V6.95 Whoofing version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old = '''<article class="card glow-purple whoofing-card">
          <h3 data-i18n="whoofing_once_name">1 Time</h3>
          <div class="desc" data-i18n="whoofing_once_desc">Accès unique.</div>
          <div class="price" data-base-price="45">45,00 €</div>
          <button class="choose primary" data-i18n="choose_offer" data-price="45" data-product="whoofing_once">Choisir cette offre</button>
          </article>'''

          new = '''<article class="card glow-purple whoofing-card">
          <h3 data-i18n="whoofing_once_name">1 Time</h3>
          <div class="desc" data-i18n="whoofing_once_desc">Accès unique.</div>
          <ul class="features">
          <li><span class="check">✓</span><span>TPM</span></li>
          <li><span class="check">✓</span><span>Work with all motherboards</span></li>
          </ul>
          <div class="price" data-base-price="25">25,00 €</div>
          <button class="choose primary" data-i18n="choose_offer" data-price="25" data-product="whoofing_once">Choisir cette offre</button>
          </article>'''

          if new in html:
              print('V6.95 Whoofing block already present.')
          elif old in html:
              html = html.replace(old, new, 1)
              path.write_text(html, encoding='utf-8')
              print('V6.95 Whoofing block applied.')
          else:
              raise SystemExit('Expected Whoofing block not found; refusing unsafe replacement.')
          PY

      - name: Commit V6.95 index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy Emulate Shop V6.95 Whoofing 25 EUR'
          git push
