name: Build Emulate Shop

on:
  push:
    branches: [main]
    paths:
      - 'site.gz.b64'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild index.html from embedded site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = ''.join(Path('site.gz.b64').read_text(encoding='utf-8').split())
          raw = base64.b64decode(payload, validate=True)
          html = gzip.decompress(raw).decode('utf-8')

          if '<html' not in html.lower() or '</html>' not in html.lower():
              raise SystemExit('Decoded payload is not a complete HTML document')

          old = '''<article class="card glow-purple whoofing-card">
          <h3 data-i18n="whoofing_once_name">1 Time</h3>
          <div class="desc" data-i18n="whoofing_once_desc">Accès unique.</div>
          <div class="price" data-base-price="45">45,00 €</div>
          <button class="choose primary" data-i18n="choose_offer" data-price="45" data-product="whoofing_once">Choisir cette offre</button>
          </article>'''
          new = '''<article class="card glow-purple whoofing-card">
          <h3 data-i18n="whoofing_once_name">1 Time</h3>
          <div class="desc" data-i18n="whoofing_once_desc">Accès unique.</div>
          <ul class="features">
          <li><span class="check">✓</span><span>TPM</span></li>
          <li><span class="check">✓</span><span>Work with all motherboards</span></li>
          </ul>
          <div class="price" data-base-price="25">25,00 €</div>
          <button class="choose primary" data-i18n="choose_offer" data-price="25" data-product="whoofing_once">Choisir cette offre</button>
          </article>'''

          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit('Whoofing product block was not found in the expected format')

          Path('index.html').write_text(html, encoding='utf-8')
          print(f'index.html rebuilt: {len(html):,} characters')
          PY

      - name: Commit generated index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deploy Emulate Shop V6.95 Whoofing 25 EUR'
          git push
