<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emulate Shop</title>
<meta name="theme-color" content="#05030b">
<style>
html,body{margin:0;min-height:100%;background:#05030b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center}.loader{display:flex;flex-direction:column;align-items:center;gap:14px}.ring{width:38px;height:38px;border:3px solid rgba(59,130,246,.18);border-top-color:#3b82f6;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#94a3b8}
</style>
</head>
<body>
<div class="loader"><div class="ring"></div><strong>Emulate Shop</strong><small>Chargement…</small></div>
<script>
(async()=>{
  try{
    const b64=(await fetch('/site.gz.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+r.status);return r.text()})).trim();
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window))throw new Error('Navigateur non compatible');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:640px;padding:32px;text-align:center"><h1>Emulate Shop</h1><p>Le site n\'a pas pu se charger.</p><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
