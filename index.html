<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emulate Shop</title>
<meta name="theme-color" content="#05030b">
<style>
html,body{margin:0;min-height:100%;background:#05030b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}body{display:grid;place-items:center}.loader{display:flex;flex-direction:column;align-items:center;gap:14px}.ring{width:38px;height:38px;border:3px solid rgba(59,130,246,.18);border-top-color:#3b82f6;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#94a3b8}
</style>
</head>
<body>
<div class="loader"><div class="ring"></div><strong>Emulate Shop</strong><small>Chargement…</small></div>
<script>
(function(){
  function fail(e){
    console.error(e);
    document.body.innerHTML='<div style="max-width:680px;padding:32px;text-align:center"><h1>Emulate Shop</h1><p>Le site n\'a pas pu se charger.</p><small>'+String((e&&e.message)||e||'Erreur inconnue')+'</small></div>';
  }
  function loadPayload(){
    return new Promise(function(resolve,reject){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','/site.gz.b64?v=4',true);
      xhr.timeout=20000;
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4)return;
        if(xhr.status>=200&&xhr.status<300) resolve(xhr.responseText);
        else reject(new Error('payload HTTP '+xhr.status));
      };
      xhr.onerror=function(){reject(new Error('chargement réseau impossible'));};
      xhr.ontimeout=function(){reject(new Error('délai de chargement dépassé'));};
      xhr.send(null);
    });
  }
  async function start(){
    try{
      var b64=await loadPayload();
      b64=String(b64||'').replace(/[^A-Za-z0-9+/=]/g,'').replace(/=+$/,'');
      while(b64.length%4)b64+='=';
      if(!b64)throw new Error('payload vide');
      var bin=atob(b64);
      var bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      if(!('DecompressionStream' in window))throw new Error('navigateur non compatible avec gzip');
      var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      var siteHtml=await new Response(stream).text();
      if(!siteHtml.toLowerCase().includes('<html'))throw new Error('contenu du site invalide');
      document.open();
      document.write(siteHtml);
      document.close();
    }catch(e){fail(e);}
  }
  start();
})();
</script>
</body>
</html>
